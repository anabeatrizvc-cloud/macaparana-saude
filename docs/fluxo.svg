<svg xmlns="http://www.w3.org/2000/svg" width="900" height="725" viewBox="0 0 900 725"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a0b68d"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f9fbf6"/><rect x="30" y="25" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="44" y="50" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">1. Cadastro e solicitação</text><text x="44" y="71" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Paciente, acompanhante e modalidade</text><rect x="330" y="25" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="344" y="50" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">2. Análise e autorização</text><text x="344" y="71" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Laudo + decisão com justificativa</text><rect x="630" y="25" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="644" y="50" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">3. Calendário</text><text x="644" y="71" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Ocorrências avulsas ou recorrentes</text><rect x="630" y="190" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="644" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">4. Planejamento</text><text x="644" y="236" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Rota, veículo, motorista, capacidade</text><rect x="330" y="190" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="344" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">5. Execução</text><text x="344" y="236" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Confirmação, embarque ou ausência</text><rect x="30" y="190" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="44" y="215" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">6. Comprovação</text><text x="44" y="236" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Declarações separadas e permanência</text><rect x="30" y="375" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="44" y="400" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">7. Conferência mensal</text><text x="44" y="421" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Paciente × datas → documentos</text><rect x="330" y="375" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="344" y="400" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">8. Benefício elegível?</text><text x="344" y="421" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Somente TFD autorizado e comprovado</text><rect x="630" y="375" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="644" y="400" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">9. Cálculo e aprovação</text><text x="644" y="421" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Regra demonstrativa versionada</text><rect x="630" y="550" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="644" y="575" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">10. Contabilidade e pagamento</text><text x="644" y="596" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Referência, data e acompanhamento</text><rect x="330" y="550" width="240" height="90" rx="9" fill="#edf3e5" stroke="#d5e1c9"/><text x="344" y="575" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#3e6448">Histórico e controle</text><text x="344" y="596" font-family="Arial,sans-serif" font-size="11" fill="#768b68">Eventos, documentos e auditoria</text><path d="M270 70H330" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 70H630" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 115V190" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 235H570" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M330 235H270" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M150 280V375" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M270 420H330" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 420H630" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 465V550" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M630 595H570" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 115V150H150V115" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="142" font-family="Arial,sans-serif" font-size="10" fill="#829674">Pendência: corrigir documentação</text><path d="M450 465V550" fill="none" stroke="#a0b68d" stroke-width="2" marker-end="url(#arrow)"/><text x="460" y="510" font-family="Arial,sans-serif" font-size="10" fill="#829674">Sem benefício: manter histórico</text><text x="30" y="690" font-family="Arial,sans-serif" font-size="12" fill="#819271">Fluxograma conceitual. Ausência ou falta de documento não equivale a atendimento comprovado.</text></svg>